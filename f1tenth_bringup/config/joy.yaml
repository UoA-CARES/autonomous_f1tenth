joy:
  ros__parameters:
    #device_name: /dev/input/js0
    device_id: 0
    deadzone: 0.01
    autorepeat_rate: 50.0
    coalesce_interval: 0.005

joy_teleop:
  ros__parameters:
    human_control:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: teleop
      deadman_buttons: [4]
      axis_mappings:
        drive-speed:
          axis: 1
          scale: 1.0
          offset: 0.0
        drive-steering_angle:
          axis: 0
          scale: 0.45
          offset: 0.0
    autonomous_disabled:
      type: topic
      interface_type: std_msgs/msg/Int8
      topic_name: /rl_deadman
      axis_mappings:
        data:
          value: 0
    autonomous_control:
      type: topic
      interface_type: std_msgs/msg/Int8
      topic_name: /rl_deadman
      deadman_buttons: [5]
      axis_mappings:
        data:
          value: 1
